name: Stage Remaining Rewritten Git Objects

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/execute-history-purge.yml

permissions:
  contents: write

concurrency:
  group: destructive-history-purge
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out purge tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Install git-filter-repo
        run: python3 -m pip install --user git-filter-repo

      - name: Rewrite isolated mirror and stage cleaned objects
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp scripts/purge-sensitive-history.sh /tmp/purge-sensitive-history.sh
          git clone --mirror "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/lab-safety-access.git
          cd /tmp/lab-safety-access.git

          historical_admin_password="$(
            git show 4d47af36a109041082d72513e21fa71fb7bc6778:scripts/purge-sensitive-history.sh \
              | sed -n 's/^literal:\(.*\)==>HISTORICAL_ADMIN_PASSWORD_REMOVED$/\1/p' \
              | head -n 1
          )"
          test -n "$historical_admin_password"

          HISTORICAL_ADMIN_PASSWORD_VALUE="$historical_admin_password" \
            bash /tmp/purge-sensitive-history.sh

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config remote.origin.mirror false

          echo "STAGE_MAP_BEGIN"
          for ref in \
            refs/heads/agent/phase3-session-hardening \
            refs/heads/agent/security-deployment-baseline \
            refs/heads/maintenance/history-purge-prep \
            refs/heads/main \
            refs/tags/deploy-bf5013701f53d9ba1e909ebf7cfea621f18ef5f3
          do
            sha="$(git rev-parse "$ref")"
            printf 'STAGE_TARGET %s %s\n' "$ref" "$sha"
            set +e
            git push --force origin "$sha:$ref"
            rc=$?
            set -e
            printf 'STAGE_RESULT %s %s\n' "$ref" "$rc"
          done
          echo "STAGE_MAP_END"

          printf 'DEPLOY_ARTIFACTS %s\n' "$(git rev-parse refs/heads/deploy-artifacts)"
