name: Locate Exact Remaining Historical Literal Match

on:
  push:
    branches:
      - maintenance/history-purge-prep
    paths:
      - .github/workflows/history-secret-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out all reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate historical literal without printing it
        shell: bash
        run: |
          set -euo pipefail
          historical_literal="$(
            sed -n 's/.*PRIVATE KEY|\([^|]*\)|process.*/\1/p' scripts/scan-sensitive-history.sh \
              | head -n 1
          )"
          test -n "$historical_literal"

          found=0
          while IFS= read -r commit; do
            while IFS= read -r matched_path; do
              [ -n "$matched_path" ] || continue
              case "$matched_path" in
                .github/*|docs/*|scripts/*|backend/test/*|README.md|deploy/bootstrap-centos9.sh)
                  continue
                  ;;
              esac
              echo "HISTORICAL_LITERAL_MATCH $commit $matched_path"
              found=1
            done < <(git grep -I -l -F "$historical_literal" "$commit" -- 2>/dev/null | sed -E 's/^[0-9a-f]{40}://' || true)
          done < <(git rev-list --all)

          echo "HISTORICAL_LITERAL_MATCH_FOUND=$found"
