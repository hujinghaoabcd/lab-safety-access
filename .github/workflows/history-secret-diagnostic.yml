name: Diagnose Remaining Historical Credential Match

on:
  push:
    branches:
      - maintenance/history-purge-prep
    paths:
      - .github/workflows/history-secret-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out all reachable history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate matching commit without printing secret values
        shell: bash
        run: |
          set -euo pipefail
          path='backend/src/controllers/adminController.js'
          found=0
          while IFS= read -r commit; do
            if ! git cat-file -e "$commit:$path" 2>/dev/null; then
              continue
            fi
            tmp="$(mktemp)"
            git show "$commit:$path" > "$tmp"

            if grep -Eq "password[[:space:]]*===[[:space:]]*['\"][^'\"]+['\"]" "$tmp" \
              && ! grep -Eq "password[[:space:]]*===[[:space:]]*['\"]HISTORICAL_ADMIN_PASSWORD_REMOVED['\"]" "$tmp"; then
              echo "HISTORY_MATCH FIXED_PASSWORD $commit $path"
              found=1
            fi
            if grep -Eq "process\.env\.JWT_SECRET[[:space:]]*\|\|[[:space:]]*['\"]" "$tmp"; then
              echo "HISTORY_MATCH JWT_FALLBACK $commit $path"
              found=1
            fi
            if grep -Eq "process\.env\.ADMIN_PASSWORD[[:space:]]*\|\|[[:space:]]*['\"]" "$tmp"; then
              echo "HISTORY_MATCH ADMIN_FALLBACK $commit $path"
              found=1
            fi
            rm -f "$tmp"
          done < <(git rev-list --all)
          echo "HISTORY_MATCH_FOUND=$found"
