name: Refresh Student Lockfile

on:
  push:
    branches:
      - agent/phase3-session-hardening
    paths:
      - frontend-h5/package.json
      - .github/workflows/refresh-student-lock.yml

permissions:
  contents: write

concurrency:
  group: refresh-student-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase3-session-hardening

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend-h5/package-lock.json

      - name: Regenerate package lock only
        working-directory: frontend-h5
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend-h5/package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend-h5/package-lock.json
          git commit -m "Sync student dependency lockfile"
          git push origin HEAD:agent/phase3-session-hardening
