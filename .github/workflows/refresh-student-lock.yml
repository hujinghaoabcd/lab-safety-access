name: Refresh student lockfile

on:
  push:
    branches:
      - agent/phase2-security-stability
    paths:
      - frontend-h5/package.json
      - .github/workflows/refresh-student-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-security-stability

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: frontend-h5/package-lock.json

      - name: Regenerate and verify lockfile
        working-directory: frontend-h5
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run typecheck
          npm run build
          npm audit --audit-level=high

      - name: Commit lockfile and retire this workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-student-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend-h5/package-lock.json .github/workflows/refresh-student-lock.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh patched student dependency lockfile"
          git push origin HEAD:agent/phase2-security-stability
