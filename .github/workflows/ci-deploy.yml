name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish a production deployment after verification
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: lab-safety-access-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend-h5/package-lock.json
            admin-web/package-lock.json

      - name: Verify backend dependencies and syntax
        working-directory: backend
        run: |
          npm ci
          find src -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Report backend dependency audit
        continue-on-error: true
        working-directory: backend
        run: npm audit --audit-level=critical

      - name: Install student dependencies
        working-directory: frontend-h5
        run: npm ci

      - name: Report student TypeScript debt
        continue-on-error: true
        working-directory: frontend-h5
        run: npm run typecheck

      - name: Build student application
        working-directory: frontend-h5
        run: npm run build

      - name: Report student dependency audit
        continue-on-error: true
        working-directory: frontend-h5
        run: npm audit --audit-level=critical

      - name: Install administrator dependencies
        working-directory: admin-web
        run: npm ci

      - name: Report administrator TypeScript debt
        continue-on-error: true
        working-directory: admin-web
        run: npm run typecheck

      - name: Build administrator application
        working-directory: admin-web
        env:
          VITE_BASE_PATH: /admin/
        run: npm run build

      - name: Report administrator dependency audit
        continue-on-error: true
        working-directory: admin-web
        run: npm audit --audit-level=critical

      - name: Validate production Compose file
        run: docker compose --env-file .env.example -f docker-compose.prod.yml config

  publish:
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.AUTO_DEPLOY_ENABLED == 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy == true))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out verified source
        uses: actions/checkout@v4

      - name: Build production images on GitHub
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull \
            --tag "lab-safety-backend:${GITHUB_SHA}" \
            --file backend/Dockerfile \
            backend
          docker build --pull \
            --tag "lab-safety-web:${GITHUB_SHA}" \
            --file deploy/web.Dockerfile \
            .

      - name: Create chunked production bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-bundle publish
          mkdir -p release-bundle publish

          docker save \
            "lab-safety-backend:${GITHUB_SHA}" \
            "lab-safety-web:${GITHUB_SHA}" \
            | gzip -1 > release-bundle/images.tar.gz

          cp docker-compose.prod.yml release-bundle/docker-compose.prod.yml
          printf '%s\n' "$GITHUB_SHA" > release-bundle/release-sha.txt

          tar -C release-bundle -czf lab-safety-production.tar.gz \
            images.tar.gz \
            docker-compose.prod.yml \
            release-sha.txt

          split -b 16m -d -a 4 \
            lab-safety-production.tar.gz \
            publish/lab-safety-production.part-

          (
            cd publish
            sha256sum lab-safety-production.part-* > chunks.sha256
          )
          sha256sum lab-safety-production.tar.gz > publish/bundle.sha256
          printf '%s\n' "$GITHUB_SHA" > publish/release-sha.txt
          printf 'schema=1\nchunk_size=16m\n' > publish/manifest.env

          du -h lab-safety-production.tar.gz
          ls -lh publish/

      - name: Publish resumable deployment branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd publish
          git init -q
          git checkout -q -b deploy-artifacts
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -q -m "Production ${GITHUB_SHA}"
          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin deploy-artifacts
