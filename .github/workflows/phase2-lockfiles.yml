name: Refresh phase 2 lockfiles

on:
  push:
    branches:
      - agent/phase2-security-stability
    paths:
      - backend/package.json
      - frontend-h5/package.json
      - admin-web/package.json
      - .github/workflows/phase2-lockfiles.yml

permissions:
  contents: write

concurrency:
  group: phase2-lockfiles
  cancel-in-progress: true

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[lockfiles]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out phase 2 branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-security-stability

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Refresh lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for project in backend frontend-h5 admin-web; do
            echo "Refreshing ${project}/package-lock.json"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund \
              --prefix "$project"
          done

      - name: Commit lockfiles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/package-lock.json frontend-h5/package-lock.json admin-web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "Refresh phase 2 dependency lockfiles [lockfiles]"
          git push origin HEAD:agent/phase2-security-stability
