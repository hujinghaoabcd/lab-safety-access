name: Refresh administrator lockfile

on:
  push:
    branches:
      - agent/phase2-security-stability
    paths:
      - .github/workflows/refresh-admin-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase2-security-stability

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Refresh and verify administrator dependencies
        working-directory: admin-web
        run: |
          set -euo pipefail
          npm audit fix --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm run typecheck
          VITE_BASE_PATH=/admin/ npm run build
          npm audit --audit-level=high

      - name: Commit lockfile and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/refresh-admin-lock.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add admin-web/package-lock.json .github/workflows/refresh-admin-lock.yml
          git diff --cached --quiet && exit 0
          git commit -m "Refresh patched administrator dependency lockfile"
          git push origin HEAD:agent/phase2-security-stability
